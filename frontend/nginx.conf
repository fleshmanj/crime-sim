server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Single Page App fallback
  location / {
    try_files $uri /index.html;
  }

  # Security headers (basic)
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy no-referrer-when-downgrade;

  # Optional: strict CSP if you keep inline scripts/styles out
  # add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://api:5000 http://localhost:5000";

  # Allow the frontend to call the API container via the browser using host port
  # If you proxy to api here, you can hide port 5000 and use /api -> api:5000
  location /api/ {
    proxy_pass http://api:5000/api/;
    proxy_set_header Host $host;
  }
}
