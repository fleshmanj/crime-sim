services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrator:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["/bin/bash","-lc"]
    command: |
      set -euo pipefail
      export PSQL="psql postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/$POSTGRES_DB -v ON_ERROR_STOP=1"

      # Create migrations table if missing
      $PSQL <<'SQL'
      CREATE TABLE IF NOT EXISTS schema_migrations (
        id        bigserial PRIMARY KEY,
        filename  text NOT NULL UNIQUE,
        sha256    text,
        applied_at timestamptz NOT NULL DEFAULT now()
      );
      SQL

      shopt -s nullglob
      for f in /migrations/*.sql; do
        name=$(basename "$f")
        already=$($PSQL -Atc "SELECT 1 FROM schema_migrations WHERE filename = '$name' LIMIT 1" || true)
        if [[ "$already" == "1" ]]; then
          echo "SKIP $name (already applied)"
          continue
        fi
        echo "APPLY $name"
        $PSQL -f "$f"
        sha=$(sha256sum "$f" | awk '{print $1}')
        $PSQL -c "INSERT INTO schema_migrations (filename, sha256) VALUES ('$name', '$sha')"
      done

      echo "All migrations done."
    restart: "no"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      migrator:
        condition: service_completed_successfully
    ports:
      - "5000:5000"

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_started
    ports:
      - "8080:80"

volumes:
  dbdata:
